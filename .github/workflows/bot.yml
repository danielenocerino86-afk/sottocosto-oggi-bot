name: Sottocosto Oggi Bot

on:
  schedule:
    # UTC scheduling covers both CET and CEST; bot checks Europe/Rome time.
    # One trigger per 10 minutes avoids overlapping duplicate cron entries.
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:    # trigger manuale + esterno (cron-job.org)

concurrency:
  group: sottocosto-bot
  cancel-in-progress: false

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            posted_deals.json
            daily_stats.json
          key: bot-data-v27-${{ github.run_id }}
          restore-keys: |
            bot-data-v27-
            bot-data-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          MIN_DISCOUNT_PERCENT: ${{ secrets.MIN_DISCOUNT_PERCENT || '10' }}
        run: python bot.py

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            posted_deals.json
            daily_stats.json
          key: bot-data-v27-${{ github.run_id }}
