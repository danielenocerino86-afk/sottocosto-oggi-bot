name: Sottocosto Oggi Bot

on:
  schedule:
    # PEAK hours (8-9, 12-13, 20-22 IT = 6-7, 10-11, 18-20 UTC): OGNI 5 min
    - cron: '*/5 6-7 * * *'      # 8-9 IT
    - cron: '*/5 10-11 * * *'    # 12-13 IT
    - cron: '*/5 18-20 * * *'    # 20-22 IT
    # Normal hours (7, 10-12, 14-19 IT = 5, 8-10, 12-17 UTC): OGNI 10 min
    - cron: '*/10 5 * * *'       # 7 IT
    - cron: '*/10 8-9 * * *'     # 10-11 IT
    - cron: '*/10 12-17 * * *'   # 14-19 IT
    # Late evening (22-23 IT = 20-21 UTC): OGNI 15 min
    - cron: '*/15 21 * * *'      # 23 IT
  workflow_dispatch:    # trigger manuale + esterno (cron-job.org)

concurrency:
  group: sottocosto-bot
  cancel-in-progress: false

jobs:
  fetch-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            posted_deals.json
            daily_stats.json
          key: bot-data-v27-${{ github.run_id }}
          restore-keys: |
            bot-data-v27-
            bot-data-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          MIN_DISCOUNT_PERCENT: ${{ secrets.MIN_DISCOUNT_PERCENT || '10' }}
        run: python bot.py

      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            posted_deals.json
            daily_stats.json
          key: bot-data-v27-${{ github.run_id }}
