name: Sottocosto Oggi Bot

on:
  schedule:
    # UTC scheduling covers both CET and CEST; bot checks Europe/Rome time.
    # One trigger per 10 minutes avoids overlapping duplicate cron entries.
    - cron: '*/10 5-22 * * *'
  workflow_dispatch:    # trigger manuale + esterno (cron-job.org)

permissions:
  contents: read

concurrency:
  group: sottocosto-bot
  cancel-in-progress: false

jobs:
  fetch-and-post:
    environment: telegram-publishing
    if: vars.BOT_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          MIN_DEAL_SCORE: ${{ vars.MIN_DEAL_SCORE || '20' }}
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          MIN_DISCOUNT_PERCENT: ${{ secrets.MIN_DISCOUNT_PERCENT || '10' }}
        run: python bot.py
