name: Sottocosto Oggi Creator Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sottocosto-creator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll-creator:
    if: vars.BOT_PAUSED != 'true'
    environment: telegram-publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install Pillow

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: creator_state.json
          key: creator-state-${{ github.run_id }}
          restore-keys: |
            creator-state-

      - name: Run creator bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python creator_bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: creator_state.json
          key: creator-state-${{ github.run_id }}
