name: Publish approved deal
on:
  workflow_dispatch:
    inputs:
      asin:
        description: 'ASIN Amazon (10 caratteri)'
        required: true
        type: string
      title:
        description: 'Titolo prodotto verificato'
        required: true
        type: string
      price:
        description: 'Prezzo verificato in EUR'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: telegram-publishing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Publish approved deal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
          DEAL_ASIN: ${{ inputs.asin }}
          DEAL_TITLE: ${{ inputs.title }}
          DEAL_PRICE: ${{ inputs.price }}
        run: python manual_publish.py
